
name: DevSecOps Basic Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-scans:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        id: install_deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Analisis SAST con Bandit
        id: bandit
        continue-on-error: true
        run: |
           bandit -r . -ll -f custom

      - name: Analisis SCA con Safety
        id: safety
        continue-on-error: true
        run: |
          safety check -r requirements.txt --full-report

      - name: Validar resultados de seguridad
        if: always() && steps.install_deps.outcome == 'success'
        run: |
          if [ "${{ steps.bandit.outcome }}" = "failure" ] || [ "${{ steps.safety.outcome }}" = "failure" ]; then
            echo "ERROR: Se detectaron vulnerabilidades."
            echo "El pipeline ha bloqueado la integracion."
            exit 1
          else
            echo "OK: No se detectaron vulnerabilidades."
            echo "Pipeline aprobado."
          fi
